{% extends 'base.html' %}

{% block title %}Login - SkillBridge{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="logo-icon gradient-primary rounded-3 p-3 d-inline-flex mb-3">
                <i class="bi bi-lightning-charge-fill text-white fs-2"></i>
            </div>
            <h2 class="fw-bold">Welcome Back!</h2>
            <p class="text-muted">Log in to your SkillBridge account</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="needs-validation" novalidate>
            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email"
                    placeholder="your@email.com" required>
                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password"
                    placeholder="••••••••" required>
                <div class="invalid-feedback">
                    Please enter your password.
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">
                        Remember me
                    </label>
                </div>
                <a href="#" class="text-primary text-decoration-none small">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-gradient-primary btn-lg w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Log In
            </button>

            <!-- Divider -->
            <div class="text-center text-muted my-3">
                <small>or continue with</small>
            </div>

            <!-- Social Login Buttons -->
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-secondary"
                    onclick="alert('Google Login is not configured in this demo version. Please use email/password.')">
                    <i class="bi bi-google me-2"></i>
                    Google
                </button>
                <button type="button" class="btn btn-outline-secondary"
                    onclick="alert('Facebook Login is not configured in this demo version. Please use email/password.')">
                    <i class="bi bi-facebook me-2"></i>
                    Facebook
                </button>
            </div>

            <!-- Register Link -->
            <div class="text-center mt-4">
                <p class="text-muted mb-0">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">Sign
                        Up</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
